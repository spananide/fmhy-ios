name: FMHY
options:
  bundleIdPrefix: de.spanani
targets:
  FMHY:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Data
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.spanani.fmhy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FMHY
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
  FMHYTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FMHY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  FMHY:
    build:
      targets:
        FMHY: all
    test:
      targets: [FMHYTests]
