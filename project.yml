name: FMHY
options:
  bundleIdPrefix: de.spanani
targets:
  FMHY:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Assets.xcassets
      - path: Data
        type: folder
    info:
      path: Info.generated.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [de.spanani.fmhy.refresh]
        UIBackgroundModes: [fetch]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: de.spanani.fmhy.search
            UIApplicationShortcutItemTitle: Search
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeSearch
          - UIApplicationShortcutItemType: de.spanani.fmhy.saved
            UIApplicationShortcutItemTitle: Saved
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeBookmark
          - UIApplicationShortcutItemType: de.spanani.fmhy.check
            UIApplicationShortcutItemTitle: Check link
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeConfirmation
          - UIApplicationShortcutItemType: de.spanani.fmhy.downloads
            UIApplicationShortcutItemTitle: Downloads
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.spanani.fmhy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FMHY
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
  FMHYTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    dependencies:
      - target: FMHY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  FMHY:
    build:
      targets:
        FMHY: all
    test:
      targets: [FMHYTests]
