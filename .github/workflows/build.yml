name: build

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fresh wiki data
        run: bash tools/fetch-data.sh

      - name: Build ad-block rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build-blocklist.sh

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 iPhone | grep -oE '[0-9A-F-]{36}')
          xcodebuild -project FMHY.xcodeproj -scheme FMHY -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO test

      - name: Simulator build
        run: xcodebuild -project FMHY.xcodeproj -scheme FMHY -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Screenshot
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 iPhone | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot $UDID
          xcrun simctl install $UDID build/Build/Products/Debug-iphonesimulator/FMHY.app
          shot() { xcrun simctl terminate $UDID de.spanani.fmhy 2>/dev/null || true; xcrun simctl launch $UDID de.spanani.fmhy "${@:2}"; sleep 10; xcrun simctl io $UDID screenshot "$1"; }
          shot screenshot.png
          shot screenshot-search.png -tab 1 -query stremo
          shot screenshot-check.png -tab 3
          shot screenshot-browser.png -tab 4 -url https://fmhy.net

      - name: Unsigned device build
        run: |
          xcodebuild -project FMHY.xcodeproj -scheme FMHY -sdk iphoneos -configuration Release -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
          mkdir Payload && cp -R build-device/Build/Products/Release-iphoneos/FMHY.app Payload/ && zip -r FMHY.ipa Payload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            screenshot*.png
            FMHY.ipa

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp FMHY.ipa "FMHY-iOS-${GITHUB_REF_NAME}.ipa"
          FILES="FMHY-iOS-${GITHUB_REF_NAME}.ipa screenshot.png screenshot-search.png screenshot-check.png"
          gh release create "$GITHUB_REF_NAME" $FILES --title "FMHY for iOS ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md             || gh release upload "$GITHUB_REF_NAME" $FILES --clobber
